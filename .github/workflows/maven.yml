```yaml
name: Java CI/CD Pipeline to Tomcat

on:
  push:
    branches: [ main ]

jobs:

  # ==========================================
  # BUILD + SONARQUBE
  # ==========================================
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Check Maven
      - name: Check Maven
        run: |
          mvn -version

      # 4. Build with Maven
      - name: Build with Maven
        run: |
          mvn clean package -DskipTests

      # 5. Check generated WAR and Java classes
      - name: Check Build Output
        run: |
          echo "WAR files:"
          ls -lh target/*.war

          echo "Compiled Java classes:"
          ls -la target/classes

      # 6. Upload WAR artifact
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapp
          path: target/*.war

      # 7. Install SonarQube Scanner CLI
      - name: Install SonarQube Scanner CLI
        run: |
          set -e

          SONAR_VERSION="7.3.0.5189"
          SONAR_DIR="$HOME/sonar-scanner-cli"

          echo "Downloading SonarQube Scanner..."

          wget -q \
            "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SONAR_VERSION}-linux-x64.zip" \
            -O /tmp/sonar-scanner.zip

          echo "Extracting SonarQube Scanner..."

          rm -rf "$SONAR_DIR"

          unzip -q /tmp/sonar-scanner.zip -d "$HOME"

          EXTRACTED_DIR="$HOME/sonar-scanner-${SONAR_VERSION}-linux-x64"

          if [ ! -f "$EXTRACTED_DIR/bin/sonar-scanner" ]; then
            echo "ERROR: sonar-scanner executable not found"

            find "$HOME" \
              -maxdepth 4 \
              -type f \
              -name "sonar-scanner" \
              -print

            exit 1
          fi

          mv "$EXTRACTED_DIR" "$SONAR_DIR"

          chmod +x "$SONAR_DIR/bin/sonar-scanner"

          echo "$SONAR_DIR/bin" >> "$GITHUB_PATH"

          echo "SonarQube Scanner version:"

          "$SONAR_DIR/bin/sonar-scanner" -v

      # 8. SonarQube Analysis
      - name: SonarQube Analysis
        env:
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -e

          echo "=========================================="
          echo "SonarQube Analysis"
          echo "=========================================="

          echo "SonarQube server: $SONAR_HOST"

          echo "Checking SonarQube server..."

          curl -f -I "$SONAR_HOST"

          echo "Running SonarQube Scanner..."

          "$HOME/sonar-scanner-cli/bin/sonar-scanner" \
            -Dsonar.projectKey=hotstar \
            -Dsonar.sources=src \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.host.url="$SONAR_HOST" \
            -Dsonar.token="$SONAR_TOKEN"


  # ==========================================
  # DEPLOY TO TOMCAT
  # ==========================================
  deploy:
    runs-on: ubuntu-latest

    needs: build

    environment: production

    steps:

      # 9. Download WAR artifact
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: myapp

      # 10. Check downloaded WAR
      - name: Check WAR file
        run: |
          echo "Downloaded files:"
          ls -lh

          echo "WAR file:"
          ls -lh *.war

      # 11. Deploy WAR to Tomcat
      - name: Deploy WAR to Tomcat
        run: |
          WAR_FILE=$(ls *.war)

          echo "Deploying $WAR_FILE to Tomcat..."

          curl -f -v \
            --upload-file "$WAR_FILE" \
            "http://${{ secrets.TOMCAT_USER }}:${{ secrets.TOMCAT_PASSWORD }}@${{ secrets.TOMCAT_HOST }}/manager/text/deploy?path=/myapp&update=true"

      # 12. Verify deployment
      - name: Verify deployment
        run: |
          echo "Checking application..."

          curl -f -I \
            "http://${{ secrets.TOMCAT_HOST }}/myapp"
```
