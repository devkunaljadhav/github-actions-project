name: Java CI/CD Pipeline to Tomcat

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: [self-hosted, linux]

    environment: production

    env:
      SONAR_HOST: ${{ secrets.SONAR_HOST }}
      SONAR_LOGIN: ${{ secrets.SONAR_LOGIN }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build
        run: mvn clean package

      - name: SonarQube Analysis
        run: |
          echo "SonarQube server URL: $SONAR_HOST"

          if [ -z "$SONAR_HOST" ]; then
            echo "ERROR: SONAR_HOST is empty"
            exit 1
          fi

          if [ -z "$SONAR_LOGIN" ]; then
            echo "ERROR: SONAR_LOGIN is empty"
            exit 1
          fi

          curl -I "$SONAR_HOST"

          mvn sonar:sonar \
            -Dsonar.projectKey=hotstar \
            -Dsonar.host.url="$SONAR_HOST" \
            -Dsonar.login="$SONAR_LOGIN"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      # 7. Download WAR artifact
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: myapp

      # 8. Deploy WAR via Tomcat Manager
      - name: Deploy to Tomcat
        run: |
          WAR_FILE=$(ls *.war)
          echo "Deploying $WAR_FILE to Tomcat..."
          curl -v --upload-file "$WAR_FILE" \
            "http://${{ secrets.TOMCAT_USER }}:${{ secrets.TOMCAT_PASSWORD }}@${{ secrets.TOMCAT_HOST }}/manager/text/deploy?path=/myapp&update=true"
      # 9. Optional: verify deployment
      - name: Verify deployment
        run: |
          curl -I http://${{ secrets.TOMCAT_HOST }}/myapp
