name: Java CI/CD Pipeline to Tomcat

on:
  push:
    branches:
      - main

jobs:

  # ============================================================
  # BUILD + SONARQUBE
  # ============================================================
  build:
    runs-on: [self-hosted, linux]

    # IMPORTANT:
    # SONAR_HOST and SONAR_TOKEN are stored in
    # GitHub Environment -> production -> Secrets
    environment: production

    steps:

      # --------------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # 2. Setup JDK 17
      # --------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # --------------------------------------------------------
      # 3. Ensure Maven is installed
      # --------------------------------------------------------
      - name: Ensure Maven is installed
        run: |
          if ! command -v mvn &> /dev/null; then
            echo "Maven not found. Installing..."
            sudo dnf install -y maven
          else
            echo "Maven is already installed"
          fi

          mvn -version


      # --------------------------------------------------------
      # 4. Cache Maven dependencies
      # --------------------------------------------------------
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-


      # --------------------------------------------------------
      # 5. Build Java application
      # --------------------------------------------------------
      - name: Build with Maven
        run: |
          mvn clean package -DskipTests


      # --------------------------------------------------------
      # 6. Upload WAR artifact
      # --------------------------------------------------------
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapp
          path: target/*.war


      # --------------------------------------------------------
      # 7. Install SonarQube Scanner CLI
      # --------------------------------------------------------
      - name: Install SonarQube Scanner CLI
        run: |
          if [ ! -d "$HOME/sonar-scanner-cli" ]; then

            echo "Downloading SonarQube Scanner CLI..."

            wget \
              https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-7.3.0.5189-linux-x64.zip \
              -O /tmp/sonar-scanner.zip

            unzip -q /tmp/sonar-scanner.zip -d "$HOME"

            mv \
              "$HOME/sonar-scanner-7.3.0.5189-linux-x64" \
              "$HOME/sonar-scanner-cli"

          else
            echo "SonarQube Scanner already installed"
          fi

          "$HOME/sonar-scanner-cli/bin/sonar-scanner" -v


      # --------------------------------------------------------
      # 8. SonarQube Analysis
      # --------------------------------------------------------
      - name: SonarQube Analysis
        env:
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

        run: |
          set -e

          echo "=========================================="
          echo "SonarQube Analysis"
          echo "=========================================="

          echo "SonarQube server: $SONAR_HOST"

          echo "Checking SonarQube server..."

          curl -f -I "$SONAR_HOST"

          echo "Running Maven SonarQube analysis..."

          mvn sonar:sonar \
            -Dsonar.projectKey=hotstar \
            -Dsonar.host.url="$SONAR_HOST" \
            -Dsonar.token="$SONAR_TOKEN"

          echo "SonarQube analysis completed successfully."


  # ============================================================
  # DEPLOY TO TOMCAT
  # ============================================================
  deploy:

    runs-on: ubuntu-latest

    needs: build

    environment: production

    steps:

      # --------------------------------------------------------
      # 9. Download WAR artifact
      # --------------------------------------------------------
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: myapp


      # --------------------------------------------------------
      # 10. Deploy WAR to Tomcat
      # --------------------------------------------------------
      - name: Deploy to Tomcat
        env:
          TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}

        run: |

          set -e

          WAR_FILE=$(find . -name "*.war" -type f | head -n 1)

          if [ -z "$WAR_FILE" ]; then
            echo "ERROR: WAR file not found!"
            exit 1
          fi

          echo "WAR file found: $WAR_FILE"

          echo "Deploying application to Tomcat..."

          curl -f -v \
            --upload-file "$WAR_FILE" \
            "http://${TOMCAT_USER}:${TOMCAT_PASSWORD}@${TOMCAT_HOST}/manager/text/deploy?path=/myapp&update=true"

          echo "Tomcat deployment completed successfully."


      # --------------------------------------------------------
      # 11. Verify deployment
      # --------------------------------------------------------
      - name: Verify deployment
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}

        run: |

          set -e

          echo "Checking application..."

          curl -f -I \
            "http://${TOMCAT_HOST}/myapp"

          echo "=========================================="
          echo "Application deployed successfully!"
          echo "=========================================="
