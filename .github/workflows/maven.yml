name: Java CI/CD Pipeline to Tomcat

on:
  push:
    branches:
      - main

jobs:

  # ============================================================
  # BUILD + SONARQUBE
  # ============================================================
  build:
    runs-on: [self-hosted, linux]

    # Your SONAR_HOST and SONAR_TOKEN are stored in:
    # GitHub → Settings → Environments → production → Secrets
    environment: production

    steps:

      # ========================================================
      # 1. Checkout code
      # ========================================================
      - name: Checkout code
        uses: actions/checkout@v4


      # ========================================================
      # 2. Setup JDK 17
      # ========================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ========================================================
      # 3. Ensure Maven is installed
      # ========================================================
      - name: Ensure Maven is installed
        run: |
          if ! command -v mvn &> /dev/null; then
            echo "Maven not found. Installing..."
            sudo dnf install -y maven
          else
            echo "Maven is already installed"
          fi

          echo "Maven version:"
          mvn -version


      # ========================================================
      # 4. Cache Maven dependencies
      # ========================================================
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-


      # ========================================================
      # 5. Build Java application
      # ========================================================
      - name: Build with Maven
        run: |
          mvn clean package -DskipTests


      # ========================================================
      # 6. Upload WAR artifact
      # ========================================================
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapp
          path: target/*.war


      # ========================================================
      # 7. SonarQube Analysis
      # ========================================================
      - name: SonarQube Analysis
        env:
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

        run: |
          set -e

          echo "=========================================="
          echo "SonarQube Analysis"
          echo "=========================================="

          echo "SonarQube server: $SONAR_HOST"

          echo "Checking SonarQube server..."

          curl -f -I "$SONAR_HOST"

          echo "Running SonarQube analysis..."

          mvn sonar:sonar \
            -Dsonar.projectKey=hotstar \
            -Dsonar.host.url="$SONAR_HOST" \
            -Dsonar.token="$SONAR_TOKEN"

          echo "=========================================="
          echo "SonarQube analysis completed"
          echo "=========================================="


  # ============================================================
  # DEPLOY TO TOMCAT
  # ============================================================
  deploy:
    runs-on: ubuntu-latest

    needs: build

    # TOMCAT secrets are also in production environment
    environment: production

    steps:

      # ========================================================
      # 8. Download WAR artifact
      # ========================================================
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: myapp


      # ========================================================
      # 9. Deploy WAR to Tomcat
      # ========================================================
      - name: Deploy to Tomcat
        env:
          TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}

        run: |
          set -e

          echo "=========================================="
          echo "Tomcat Deployment"
          echo "=========================================="

          WAR_FILE=$(find . -name "*.war" -type f | head -n 1)

          if [ -z "$WAR_FILE" ]; then
            echo "ERROR: WAR file not found!"
            exit 1
          fi

          echo "WAR file: $WAR_FILE"

          echo "Deploying application to Tomcat..."

          curl -f -v \
            --upload-file "$WAR_FILE" \
            "http://${TOMCAT_USER}:${TOMCAT_PASSWORD}@${TOMCAT_HOST}/manager/text/deploy?path=/myapp&update=true"

          echo "=========================================="
          echo "Tomcat deployment completed"
          echo "=========================================="


      # ========================================================
      # 10. Verify deployment
      # ========================================================
      - name: Verify deployment
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}

        run: |
          set -e

          echo "Checking application..."

          curl -f -I \
            "http://${TOMCAT_HOST}/myapp"

          echo "=========================================="
          echo "Application is running on Tomcat"
          echo "=========================================="
