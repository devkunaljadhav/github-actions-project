name: Java CI/CD Pipeline to Tomcat

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: [self-hosted, linux]

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Ensure Maven is installed
      - name: Ensure Maven is installed
        run: |
          if ! command -v mvn >/dev/null 2>&1; then
            echo "Maven not found. Installing..."
            sudo dnf install -y maven
          else
            echo "Maven is already installed"
          fi

          mvn -version

      # 4. Build application
      - name: Build with Maven
        run: |
          mvn clean package -DskipTests

      # 5. Upload WAR artifact
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapp
          path: target/*.war

      # 6. SonarQube Analysis
      - name: SonarQube Analysis
        env:
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -e

          echo "Checking SonarQube configuration..."

          if [ -z "$SONAR_HOST" ]; then
            echo "ERROR: SONAR_HOST secret is empty or not available."
            exit 1
          fi

          if [ -z "$SONAR_TOKEN" ]; then
            echo "ERROR: SONAR_TOKEN secret is empty or not available."
            exit 1
          fi

          echo "SonarQube URL: $SONAR_HOST"

          echo "Checking SonarQube connectivity..."
          curl -f -I "$SONAR_HOST"

          echo "Running SonarQube analysis..."

          mvn sonar:sonar \
            -Dsonar.projectKey=hotstar \
            -Dsonar.host.url="$SONAR_HOST" \
            -Dsonar.token="$SONAR_TOKEN"

          echo "SonarQube analysis completed."


  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment: production

    steps:

      # 7. Download WAR
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: myapp

      # 8. Deploy WAR to Tomcat
      - name: Deploy to Tomcat
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
        run: |
          set -e

          if [ -z "$TOMCAT_HOST" ]; then
            echo "ERROR: TOMCAT_HOST secret is empty."
            exit 1
          fi

          if [ -z "$TOMCAT_USER" ]; then
            echo "ERROR: TOMCAT_USER secret is empty."
            exit 1
          fi

          if [ -z "$TOMCAT_PASSWORD" ]; then
            echo "ERROR: TOMCAT_PASSWORD secret is empty."
            exit 1
          fi

          WAR_FILE=$(find . -maxdepth 1 -name "*.war" -print -quit)

          if [ -z "$WAR_FILE" ]; then
            echo "ERROR: WAR file not found."
            exit 1
          fi

          echo "Deploying $WAR_FILE to Tomcat..."

          curl -f -v \
            --upload-file "$WAR_FILE" \
            "http://${TOMCAT_USER}:${TOMCAT_PASSWORD}@${TOMCAT_HOST}/manager/text/deploy?path=/myapp&update=true"

          echo "Tomcat deployment completed."

      # 9. Verify deployment
      - name: Verify deployment
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
        run: |
          echo "Checking application..."

          curl -f -I \
            "http://${TOMCAT_HOST}/myapp"

          echo "Application is deployed successfully."
